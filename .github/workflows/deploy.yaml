# .github/workflows/docker-publish.yml
name: Docker Hub Push

on:
  release:
    types: [published]

jobs:
  # 테스트가 깨진 채로는 이미지를 올리지 않는다.
  test:
    uses: ./.github/workflows/test.yaml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push for backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/notemd_backend:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/notemd_backend:latest

      - name: Build and push for frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/notemd_frontend:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/notemd_frontend:latest
          build-args: |
            NEXT_PUBLIC_API_HOST=${{ secrets.NEXT_PUBLIC_API_HOST }}
            NEXT_PUBLIC_COLLAB_URL=${{ secrets.NEXT_PUBLIC_COLLAB_URL }}

      # 공동 편집 서버(4.0). 에디터 스키마(frontend/lib/editor_schema.ts)를 담아야 해서 저장소 루트에서 빌드한다.
      - name: Build and push for collab
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./collab/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/notemd_collab:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/notemd_collab:latest
