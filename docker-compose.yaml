version: "3"

services:
  frontend:
    build:
      context: frontend
    container_name: mynote-frontend
    ports:
      - "3000:3000"
    restart: always

  backend:
    build:
      context: backend
    container_name: mynote-backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

volumes:
  db_data:
  nginx_data:
  mynote_backend:
