version: "3"

services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.local
      args:
        NEXT_PUBLIC_API_HOST: http://localhost:8002
    container_name: notemd-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: always
    ports:
      - "3000:3000"
    networks:
      - notemd-network

  backend:
    build:
      context: backend
      dockerfile: Dockerfile.local
    container_name: notemd-backend
    restart: always
    volumes:
      - ./backend:/app
    environment:
      SETTINGS_FILE: "local"
      DEBUG: "false"
      SECRET_KEY: "c4a4211e8ec70dcea5234660a2c269de280b456e9f8c9714007d7badcd2bbd66"

      FRONTEND_URL: "http://localhost:3000"

      DB_NAME: "notemd"
      DB_USER: "admin"
      DB_PASSWORD: "admin123!"

      MEILISEARCH_URL: "http://meilisearch:7700"
      MEILISEARCH_MASTER_KEY: 6547723aae4112da0be104ad3ec45cf2057cd6baa3c63dc4a0ad9dbb3e9ff45b
      MEILISEARCH_INDEX_UID: "notes"
      # macOS Docker Desktop 의 bind mount 는 inotify 이벤트가 안정적으로 전달되지 않아
      # uvicorn --reload 가 변경을 못 잡는 경우가 있음 -> polling 방식으로 강제
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8002:8000"
    depends_on:
      - postgres
      - meilisearch
    networks:
      - notemd-network

  postgres:
    image: postgres:16
    container_name: notemd-db
    restart: always
    environment:
      POSTGRES_DB: "notemd"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin123!"
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - notemd-network

  meilisearch:
    image: getmeili/meilisearch:v1.45
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: 6547723aae4112da0be104ad3ec45cf2057cd6baa3c63dc4a0ad9dbb3e9ff45b
      MEILI_ENV: production          # development 이면 master key 없어도 됨
      MEILI_DB_PATH: /meili_data
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - notemd-network

volumes:
  postgres_data:
  meili_data:

networks:
  notemd-network:
    driver: bridge