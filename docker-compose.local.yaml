version: "3"

services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.local
      args:
        NEXT_PUBLIC_API_HOST: http://localhost:8002
    container_name: notemd-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: always
    ports:
      - "3000:3000"
    networks:
      - notemd-network

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: notemd-backend
    restart: always
    volumes:
      - ./backend:/app
    environment:
      SETTINGS_FILE: "local"
      DEBUG: "false"
      SECRET_KEY: "c4a4211e8ec70dcea5234660a2c269de280b456e9f8c9714007d7badcd2bbd66"

      FRONTEND_URL: "http://localhost:3000"

      DB_NAME: "notemd"
      DB_USER: "admin"
      DB_PASSWORD: "admin123!"

      OPENSEARCH_HOST: "opensearch"
      OPENSEARCH_PORT: 9200
      OPENSEARCH_USER: "admin"
      OPENSEARCH_PASSWORD: "NoteMdSearch!2026#Alpha"
      OPENSEARCH_INDEX_NAME: "notemd_1"
    ports:
      - "8002:8000"
    depends_on:
      - postgres
      - opensearch
    networks:
      - notemd-network

  postgres:
    image: postgres:16
    container_name: notemd-db
    restart: always
    environment:
      POSTGRES_DB: "notemd"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin123!"
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - notemd-network

  opensearch:
    build:
      context: backend
      dockerfile: Dockerfile.opensearch
    container_name: notemd-opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - plugins.security.ssl.http.enabled=false
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=NoteMdSearch!2026#Alpha
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -u admin:NoteMdSearch!2026#Alpha -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - notemd-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: notemd-opensearch-dashboards
    restart: always
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=NoteMdSearch!2026#Alpha
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - notemd-network

volumes:
  postgres_data:
  opensearch_data:

networks:
  notemd-network:
    driver: bridge